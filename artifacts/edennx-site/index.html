<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EdenNX | Biotech intelligence infrastructure</title>
    <meta
      name="description"
      content="EdenNX builds the intelligence backbone of modern biotech: EdenRadar for licensing intelligence across 430+ research institutions, and EdenCompliance for vendor quality and audit records."
    />
    <meta name="theme-color" content="#0a0e1a" />
    <link rel="canonical" href="https://edennx.com/" />

    <!-- Icons -->
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/eden-mark.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Open Graph (static defaults for social crawlers, which do not run JS) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="EdenNX" />
    <meta property="og:title" content="EdenNX - The intelligence backbone of modern biotech" />
    <meta
      property="og:description"
      content="The intelligence infrastructure of modern biotech: 430+ institutions, 35,000+ licensable assets, scored daily."
    />
    <meta property="og:url" content="https://edennx.com/" />
    <meta property="og:image" content="https://edennx.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="EdenNX - The intelligence backbone of modern biotech" />
    <meta
      name="twitter:description"
      content="The intelligence infrastructure of modern biotech: 430+ institutions, 35,000+ licensable assets, scored daily."
    />
    <meta name="twitter:image" content="https://edennx.com/og-image.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap"
      rel="stylesheet"
    />

    <!-- Organization schema for rich results. Brands are listed so the product
         names are associated with the company rather than only appearing as
         body copy, and both product domains are declared as sameAs so search
         engines tie the three sites together. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "EdenNX",
        "url": "https://edennx.com",
        "logo": "https://edennx.com/eden-mark.png",
        "description": "The backbone biotech runs on. EdenNX builds EdenRadar for licensing intelligence across research institutions, and EdenCompliance for vendor quality and audit records.",
        "sameAs": [
          "https://www.linkedin.com/company/edennx",
          "https://edenradar.com",
          "https://edencompliance.com"
        ],
        "brand": [
          {
            "@type": "Brand",
            "name": "EdenRadar",
            "url": "https://edenradar.com",
            "description": "Industry BD intelligence across university tech transfer offices."
          },
          {
            "@type": "Brand",
            "name": "EdenCompliance",
            "url": "https://edencompliance.com",
            "description": "Vendor qualification and audit management for regulated quality teams."
          },
          { "@type": "Brand", "name": "EdenLab" },
          { "@type": "Brand", "name": "EdenDiscovery" },
          { "@type": "Brand", "name": "EdenMarket" }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
